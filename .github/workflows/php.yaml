name: PHP Checks

on: [push, pull_request]

jobs:
    php-lint:
        name: "PHP Lint"

        runs-on: "ubuntu-latest"

        strategy:
            matrix:
                php-version:
                    - "8.0"
                    - "8.1"
                    - "8.2"

        steps:
            -
                name: "Checkout"
                uses: "actions/checkout@v2"
            -
                name: "Setup PHP"
                uses: "shivammathur/setup-php@v2"
                with:
                    php-version: "${{ matrix.php-version }}"
                    coverage: none
                    tools: composer:v2
            - 
                name: "Run PHP lint"
                run: "composer test:phplint"
    php-cs-fixer:
        name: PHP-CS-Fixer
        runs-on: ubuntu-latest
        needs: php-lint
        steps:
            - name: "Checkout"
              uses: "actions/checkout@v2"
            - name: Setup PHP
              uses: shivammathur/setup-php@master
              with:
                  php-version: 8.1
            -
              name: "Install composer dependencies"
              run: "composer install --no-interaction --no-progress --no-suggest"
            - run: composer require friendsofphp/php-cs-fixer:3.64.0
            - run: .Build/bin/php-cs-fixer fix --diff --dry-run
    php-compatibility:
        name: "PHPCompatibility"
        runs-on: ubuntu-latest
        needs: php-lint
        steps:
            -
                name: "Checkout"
                uses: actions/checkout@v2
            -
                name: "Install PHP"
                uses: shivammathur/setup-php@v2
                with:
                    php-version: "8.1"
                    coverage: none
                    tools: composer:v2
            -
                name: Prepare TYPO3
                uses: ./.github/actions/t3prepare
                with:
                    php-version: ${{ matrix.php-version }}
            -
                name: "Run PHP CS with PHPCompatibility rule"
                run: "composer test:phpcompat ${{ matrix.php-version }}"
        strategy:
            fail-fast: false
            matrix:
                php-version:
                    - "8.0"
                    - "8.1"
                    - "8.2"
    php-unit:
        name: "PHP Unit"
        runs-on: "ubuntu-latest"
        needs: ["php-lint", "php-cs-fixer"]
        steps:
            -
                name: "Checkout"
                uses: "actions/checkout@v2"
            -
                name: "Setup PHP"
                uses: "shivammathur/setup-php@v2"
                with:
                    php-version: "${{ matrix.php-version }}"
                    extensions: "${{ env.PHP_EXTENSIONS }}"
            -
                 name: "Show Composer version"
                 run: composer --version
            -
                name: "Determine composer cache directory"
                id: "determine-composer-cache-directory"
                run: echo "directory={$(composer config cache-dir)}" >> $GITHUB_OUTPUT
            -
                name: "Cache dependencies installed with composer"
                uses: "actions/cache@v4"
                with:
                    key: "php-${{ matrix.php-version }}-composer-${{ hashFiles('composer.lock') }}"
                    path: "${{ steps.determine-composer-cache-directory.outputs.directory }}"
                    restore-keys: "php-${{ matrix.php-version }}-composer-"
            -
                name: "drop security advisories"
                run: "composer config --global audit.block-insecure false"
            -
                name: "Install TYPO3 Core"
                env:
                    TYPO3: "${{ matrix.typo3-version }}"
                run: |
                    composer require --no-install --no-progress typo3/minimal:"$TYPO3"
                    composer show
            -
                name: "Install dependencies with composer"
                run: |
                    composer update --no-ansi --no-interaction --no-progress --with-dependencies
                    composer show
            -
                name: "Run PHP unit tests"
                run: "composer test:phpunit"
        strategy:
            fail-fast: false
            matrix:
                include:
                    - typo3-version: ^11.5
                      php-version: 8.1
                    - typo3-version: ^12.4
                      php-version: 8.1        
